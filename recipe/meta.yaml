{% set name = "ai2thor" %}
{% set version = "4.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 67c44ca367d963189be82f86357a6b5f5265f27874bc631e756fb0e567c7f1c5

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pytest-runner
    - python {{ python_min }}
  run:
    - aws-requests-auth
    - flask
    - msgpack-python
    - numpy
    - opencv
    - pillow
    - progressbar2
    - python >={{ python_min }}
    - python-xlib
    - botocore
    - requests
    - werkzeug >=0.15.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - ai2thor
    - ai2thor.util

about:
  home: https://github.com/allenai/ai2thor
  summary: AI2 Thor is a lightweight AI framework that interacts with the Unity3d Game Engine.
  license: Apache-2.0
  # check later once the license file is included in the source distribution 
  license_file: LICENSE

extra:
  recipe-maintainers:
    - systemshift
    - ekolve
